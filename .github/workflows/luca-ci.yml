name: LUCA-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-gcc
          - os: ubuntu-latest
            preset: ci-clang
          - os: windows-latest
            preset: ci-msvc

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v5

    - name: Install re2c (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y re2c

    - name: Install re2c (Windows)
      if: runner.os == 'Windows'
      run: choco install -y re2c

    - name: Install libc++ (Clang)
      if: matrix.preset == 'ci-clang'
      run: sudo apt-get install -y libc++-dev libc++abi-dev

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgJsonGlob: 'src/vcpkg.json'

    - name: Configure
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Test
      run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v5

    - name: Install re2c
      run: sudo apt-get install -y re2c

    - name: Install gcovr
      run: pip install gcovr

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgJsonGlob: 'src/vcpkg.json'

    - name: Configure
      run: cmake --preset ci-coverage

    - name: Build
      run: cmake --build --preset ci-coverage

    - name: Test
      run: ctest --preset ci-coverage

    - name: Generate coverage report
      run: |
        mkdir -p coverage
        gcovr --root . \
          --filter 'luca/' \
          --html-details coverage/index.html \
          --xml coverage/coverage.xml \
          --print-summary \
          b_/ci-coverage

    - name: Post coverage summary
      if: always()
      run: |
        echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        gcovr --root . \
          --filter 'luca/' \
          --print-summary \
          b_/ci-coverage 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: src/coverage/
