name: LUCA-CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: cl
            cxx: cl

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v5

    - name: Configure CMake
      run: >
        cmake -B b
        -DCMAKE_C_COMPILER=${{ matrix.cc }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
        -DCMAKE_CXX_STANDARD=23
        -DCMAKE_CXX_STANDARD_REQUIRED=ON
        -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build b

    - name: Test
      run: ctest --test-dir b --output-on-failure

  coverage:
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: src

    steps:
    - uses: actions/checkout@v5

    - name: Install gcovr
      run: pip install gcovr

    - name: Configure CMake
      run: >
        cmake -B b
        -DCMAKE_C_COMPILER=gcc
        -DCMAKE_CXX_COMPILER=g++
        -DCMAKE_CXX_STANDARD=23
        -DCMAKE_CXX_STANDARD_REQUIRED=ON
        -DBUILD_TESTING=ON
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_FLAGS="--coverage"

    - name: Build
      run: cmake --build b

    - name: Test
      run: ctest --test-dir b --output-on-failure

    - name: Generate coverage report
      run: |
        mkdir -p coverage
        gcovr --root . \
          --filter 'luca/' \
          --html-details coverage/index.html \
          --xml coverage/coverage.xml \
          --print-summary \
          b

    - name: Post coverage summary
      if: always()
      run: |
        echo "## Code Coverage Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        gcovr --root . \
          --filter 'luca/' \
          --print-summary \
          b 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload coverage report
      uses: actions/upload-artifact@v6
      with:
        name: coverage-report
        path: src/coverage/
