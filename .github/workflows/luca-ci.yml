name: Luca-CI

on:
  push:
    branches: [ "main" ]
    tags: 
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore ./src
    - name: Build
      run: dotnet build ./src --no-restore
    - name: Test
      run: dotnet test ./src --no-build --verbosity normal
    - name: Publish
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        dotnet publish ./src/LucaCli/LucaCli.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./artifacts/win-x64
        dotnet publish ./src/LucaCli/LucaCli.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./artifacts/linux-x64
        dotnet publish ./src/LucaCli/LucaCli.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./artifacts/linux-arm64
        zip -r ./artifacts/luca-win-x64.zip ./artifacts/win-x64
        tar -czvf ./artifacts/luca-linux-x64.tar.gz -C ./artifacts/linux-x64 .
        tar -czvf ./artifacts/luca-linux-arm64.tar.gz -C ./artifacts/linux-arm64 .
      env:
        MinVerTagPrefix: v
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./artifacts/luca-win-x64.zip
          ./artifacts/luca-linux-x64.tar.gz
          ./artifacts/luca-linux-arm64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
